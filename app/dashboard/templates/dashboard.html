<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Bot — Dashboard</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --dim: #8b949e;
            --green: #3fb950;
            --red: #f85149;
            --yellow: #d2991d;
            --blue: #58a6ff;
            --purple: #bc8cff;
            --radius: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        header h1 { font-size: 24px; font-weight: 600; }
        .live-dot {
            width: 10px; height: 10px;
            background: var(--green);
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .generated { font-size: 13px; color: var(--dim); }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
        }
        .card .label {
            font-size: 12px;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .card .value { font-size: 28px; font-weight: 700; }
        .card .sub { font-size: 13px; color: var(--dim); margin-top: 2px; }
        .green { color: var(--green); }
        .red { color: var(--red); }
        .yellow { color: var(--yellow); }
        .blue { color: var(--blue); }
        .purple { color: var(--purple); }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            margin-top: 8px;
        }
        .position-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .position-row:last-child { border-bottom: none; }
        .position-row .pos-pair { font-weight: 700; min-width: 110px; }
        .position-row .pos-metric { text-align: center; }
        .position-row .pos-metric .val { font-size: 16px; font-weight: 600; }
        .position-row .pos-metric .sub { font-size: 11px; color: var(--dim); }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 24px;
        }
        th, td { padding: 10px 14px; text-align: left; font-size: 14px; }
        th {
            color: var(--dim);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }
        td { border-bottom: 1px solid var(--border); }
        tr:last-child td { border-bottom: none; }
        .pill {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .pill-open { background: rgba(88,166,255,0.15); color: var(--blue); }
        .pill-close { background: rgba(139,148,158,0.15); color: var(--dim); }
        .pill-update { background: rgba(210,153,29,0.15); color: var(--yellow); }
        .pill-cancel { background: rgba(248,81,73,0.15); color: var(--red); }
        .pill-unknown { background: rgba(139,148,158,0.1); color: var(--dim); }
        .pair-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .pair-row .name { width: 100px; font-size: 13px; font-weight: 600; }
        .pair-row .track {
            flex: 1;
            height: 20px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }
        .pair-row .fill { height: 100%; border-radius: 4px; }
        .pair-row .nums { width: 140px; font-size: 12px; text-align: right; color: var(--dim); }
        .recent-item { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
        .recent-item:last-child { border-bottom: none; }
        .recent-item .meta { color: var(--dim); font-size: 11px; }
        .recent-item .preview {
            color: var(--text);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .empty-state {
            color: var(--dim);
            padding: 32px;
            text-align: center;
            font-size: 16px;
        }
        .live-badge {
            display: inline-block;
            font-size: 10px;
            background: rgba(63,185,80,0.15);
            color: var(--green);
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>

    <header>
        <h1><span class="live-dot"></span>Signal Bot</h1>
        <span class="generated" id="updated">Loading...</span>
    </header>

    <div class="grid" id="metrics"></div>

    <!-- OPEN POSITIONS — real exchange data -->
    <h2 class="section-title">Open Positions <span class="live-badge">LIVE</span></h2>
    <div class="card" id="positions" style="margin-bottom: 24px;">
        <div class="empty-state">No open positions on Binance Demo...</div>
    </div>

    <h2 class="section-title">Closed Trades — Per Pair</h2>
    <div class="card" id="pairs" style="margin-bottom: 24px;">
        <div class="empty-state">No closed trades yet...</div>
    </div>

    <h2 class="section-title">Recent Signals</h2>
    <div class="card" id="recent">
        <div class="empty-state">No signals yet...</div>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);

        function fmtPnl(val) {
            if (val === 0) return '<span>$' + val + '</span>';
            const sign = val > 0 ? '+' : '';
            const cls  = val > 0 ? 'green' : 'red';
            return '<span class="' + cls + '">' + sign + '$' + val.toFixed(2) + '</span>';
        }

        function fmtPct(val) {
            if (val === 0) return val + '%';
            const sign = val > 0 ? '+' : '';
            const cls  = val > 0 ? 'green' : 'red';
            return '<span class="' + cls + '">' + sign + val + '%</span>';
        }

        function pillClass(action) {
            if (action === 'OPEN') return 'pill-open';
            if (action === 'CLOSE') return 'pill-close';
            if (action === 'CANCEL_ORDER') return 'pill-cancel';
            if (['UPDATE_STOP','UPDATE_TP','MOVE_TO_BE','PARTIAL_CLOSE','LIMIT_FILLED'].includes(action)) return 'pill-update';
            return 'pill-unknown';
        }

        async function refresh() {
            try {
                const resp = await fetch('/api/stats');
                const d = await resp.json();

                $('updated').textContent = 'Updated: ' + d.generated_at;

                // Metrics cards
                let html = '';

                html += '<div class="card"><div class="label">Total Closed PnL</div><div class="value">' + fmtPnl(d.total_pnl) + '</div><div class="sub">' + fmtPct(d.total_pnl_pct) + ' · ' + d.closed_trades + ' trades</div></div>';

                html += '<div class="card"><div class="label">Win Rate</div><div class="value ' + (d.win_rate >= 50 ? 'green' : d.win_rate >= 30 ? 'yellow' : 'red') + '">' + d.win_rate + '%</div><div class="sub">' + d.wins + 'W / ' + d.losses + 'L / ' + d.breakeven + 'B</div></div>';

                html += '<div class="card"><div class="label">Total Trades</div><div class="value">' + d.total_trades + '</div><div class="sub">' + d.open_trades + ' open · ' + d.pending_trades + ' pending · ' + d.closed_trades + ' closed</div></div>';

                html += '<div class="card"><div class="label">Avg Parse Latency</div><div class="value blue">' + Math.round(d.avg_latency_ms) + 'ms</div><div class="sub">Regex parser (no LLM)</div></div>';

                if (d.best_trade) {
                    html += '<div class="card"><div class="label">Best Trade</div><div class="value green">$' + d.best_trade.pnl + '</div><div class="sub">' + d.best_trade.pair + ' — ' + d.best_trade.pnl_pct + '%</div></div>';
                }

                if (d.worst_trade) {
                    html += '<div class="card"><div class="label">Worst Trade</div><div class="value red">$' + d.worst_trade.pnl + '</div><div class="sub">' + d.worst_trade.pair + ' — ' + d.worst_trade.pnl_pct + '%</div></div>';
                }

                $('metrics').innerHTML = html;

                // LIVE OPEN POSITIONS
                if (d.open_positions && d.open_positions.length > 0) {
                    let posHtml = '';
                    d.open_positions.forEach(p => {
                        const pnlCls = p.unrealized_pnl >= 0 ? 'green' : 'red';
                        const pctCls = p.unrealized_pnl_pct >= 0 ? 'green' : 'red';

                        posHtml += '<div class="position-row">';
                        posHtml += '<span class="pos-pair">' + p.pair + '</span>';
                        posHtml += '<span class="pos-metric"><div class="sub">Entry</div><div class="val">$' + p.entry_price + '</div></span>';
                        posHtml += '<span class="pos-metric"><div class="sub">Mark</div><div class="val">$' + p.mark_price + '</div></span>';
                        posHtml += '<span class="pos-metric"><div class="sub">Size</div><div class="val">' + p.quantity.toFixed(0) + '</div></span>';
                        posHtml += '<span class="pos-metric"><div class="sub">Lev</div><div class="val">' + p.leverage + 'x</div></span>';
                        posHtml += '<span class="pos-metric"><div class="sub">Unreal. PnL</div><div class="val ' + pnlCls + '">$' + p.unrealized_pnl.toFixed(2) + '</div><div class="sub ' + pctCls + '">' + p.unrealized_pnl_pct + '%</div></span>';
                        posHtml += '</div>';
                    });
                    $('positions').innerHTML = posHtml;
                } else {
                    $('positions').innerHTML = '<div class="empty-state">No open positions on Binance Demo</div>';
                }

                // PAIRS
                if (d.pairs && d.pairs.length > 0) {
                    let pairHtml = '';
                    d.pairs.forEach(p => {
                        const width = Math.min(p.win_rate, 100);
                        const color = p.pnl >= 0 ? 'var(--green)' : 'var(--red)';
                        pairHtml += '<div class="pair-row">';
                        pairHtml += '<span class="name">' + p.pair + '</span>';
                        pairHtml += '<div class="track"><div class="fill" style="width:' + width + '%;background:' + color + ';"></div></div>';
                        pairHtml += '<span class="nums">' + p.trades + ' trades · ' + p.win_rate + '% WR · ' + fmtPnl(p.pnl) + '</span>';
                        pairHtml += '</div>';
                    });
                    $('pairs').innerHTML = pairHtml;
                } else {
                    $('pairs').innerHTML = '<div class="empty-state">No closed trades yet...</div>';
                }

                // RECENT SIGNALS
                if (d.recent_signals && d.recent_signals.length > 0) {
                    let sigHtml = '';
                    d.recent_signals.forEach(s => {
                        sigHtml += '<div class="recent-item">';
                        sigHtml += '<div class="meta">#' + s.id + ' · ' + s.time + ' · ' + Math.round(s.latency) + 'ms · <span class="pill ' + pillClass(s.action) + '">' + s.action + '</span></div>';
                        sigHtml += '<div class="preview">' + s.text.replace(/</g,'&lt;') + '</div>';
                        sigHtml += '</div>';
                    });
                    $('recent').innerHTML = sigHtml;
                } else {
                    $('recent').innerHTML = '<div class="empty-state">No signals yet — waiting for data...</div>';
                }

            } catch (err) {
                console.error('Refresh failed:', err);
            }
        }

        refresh();
        setInterval(refresh, 5000); // refresh every 5 seconds (was 10)
    </script>
</body>
</html>
